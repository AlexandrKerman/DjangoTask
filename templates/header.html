<header class="header">
    <a class="home_link" href="/">
        <span class="Blue_text">Sky</span><span class="Green_text">Store</span>
    </a>
    <div class="navbar">
        <a class="navbar_link" href="{% url 'blog' %}">Блог</a>
        <a class="navbar_link" href="{% url 'home' %}">Каталог</a>
        <a class="navbar_link" href="{% url 'contacts' %}">Контакты</a>
        {% if user.is_authenticated %}
        <form class="navbar_link" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="navbar_btn" type="submit">Выйти</button>
        </form>
        {% else %}
        <a class="navbar_link" href="{% url 'login' %}">Войти</a>
        {% endif %}
    </div>
</header>
